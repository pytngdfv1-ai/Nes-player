name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # sin firma de código
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar icono desde assets/icon-source.png (si existe)
        shell: bash
        run: |
          if [ -f assets/icon-source.png ]; then
            pip install pillow
            python scripts/make_icon.py
          else
            echo "Sin assets/icon-source.png: se usa assets/icon.ico tal cual."
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de configuración
        run: npm test

      - name: Preparar EmulatorJS (motor + core nes/fceumm, local)
        run: npm run prepare-emulator

      - name: Empaquetar (instalador NSIS + portable)
        run: npx electron-builder --win --x64 --publish never

      - name: Tamaños
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: NES-Player-Setup
          path: dist/NES-Player-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Subir portable
        uses: actions/upload-artifact@v4
        with:
          name: NES-Player-Portable
          path: dist/NES-Player-Portable-*.exe
          if-no-files-found: error
          retention-days: 14
